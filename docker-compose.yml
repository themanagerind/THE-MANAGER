# Local development infra only — Postgres + Redis, matching backend/.env.example.
# Run the backend (uvicorn) and frontend (npm run dev) natively outside Docker
# for fast hot-reload; this just saves installing Postgres/Redis by hand,
# which is especially painful for Redis on Windows.
#
# Postgres is exposed on host port 5433 (not the standard 5432) — a lot of
# Windows machines already have a native postgres.exe Windows Service quietly
# bound to 5432 (from some other install), which silently steals every
# connection meant for this container and is very confusing to debug. 5433
# avoids that collision without needing to touch whatever else owns 5432.
#
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: housing_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
