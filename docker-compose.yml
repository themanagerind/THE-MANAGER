# Local development infra only — Postgres + Redis, matching backend/.env.example.
# Run the backend (uvicorn) and frontend (npm run dev) natively outside Docker
# for fast hot-reload; this just saves installing Postgres/Redis by hand,
# which is especially painful for Redis on Windows.
#
# Postgres is exposed on host port 5433 (not the standard 5432), and Redis on
# 6380 (not 6379) — a lot of Windows machines already have native postgres.exe
# and redis-server.exe Windows Services quietly bound to the standard ports
# (from some other install), which silently steal every connection meant for
# these containers and are very confusing to debug (Redis in particular: the
# client's handshake fails with "unknown command 'HELLO'" against a stray
# ancient Redis version, not an obvious "wrong server" error). These
# non-standard ports avoid that collision without needing to touch whatever
# else owns 5432/6379.
#
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: housing_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
