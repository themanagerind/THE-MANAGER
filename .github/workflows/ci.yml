name: CI

# Runs on every push to main and every PR targeting main — this repo has no
# other CI yet, so this is the only gate a PR gets before merge (see
# CLAUDE.md Section 6 rule 1: "Never break the test suite").
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Postgres/Redis as service containers, matching docker-compose.yml's
    # own images — tests/conftest.py's own os.environ.setdefault() calls
    # already point at postgres:5432/housing_test and redis:6379/db15 by
    # default (see TEST_DATABASE_URL/TEST_REDIS_URL there), so no secrets
    # or extra env vars are needed for the test step itself.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: housing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          # requirements.txt doesn't pull this in on every platform — see
          # this session's own local-setup troubleshooting; without it,
          # SQLAlchemy's async engine fails to import at all.
          pip install greenlet

      # Bootstraps the native Postgres ENUM types every model column uses
      # (pg_enum(..., create_type=False) — see app/models/pg_enum.py):
      # tests/conftest.py's own schema setup only runs Base.metadata.
      # create_all, which does NOT create these types, only tables. A
      # fresh service-container DB has neither, so migrations must run
      # once before pytest — conftest's create_all/drop_all cycle then
      # only ever touches tables, leaving the types (created here) intact
      # for the duration of the job.
      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/housing_test
          JWT_SECRET_KEY: ci-only-secret-not-for-production
        run: alembic upgrade head

      - name: Run test suite
        run: pytest -q

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
