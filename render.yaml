services:
  # ----------------------------------------------------
  # Backend API Service (FastAPI)
  # ----------------------------------------------------
  - type: web
    name: the-manager-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: the-manager-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: the-manager-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: ECOM_STORE_API_KEY
        generateValue: true

  # ----------------------------------------------------
  # Frontend PWA Service (Nginx + Built React PWA)
  # ----------------------------------------------------
  - type: web
    name: the-manager-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: starter
    envVars:
      - key: BACKEND_UPSTREAM_URL
        fromService:
          type: web
          name: the-manager-backend
          property: host

  # ----------------------------------------------------
  # Redis Cache & OTP Store
  # ----------------------------------------------------
  - type: redis
    name: the-manager-redis
    ipAllowList: []
    plan: starter
    maxmemoryPolicy: allkeys-lru

# ----------------------------------------------------
# Managed PostgreSQL Database
# ----------------------------------------------------
databases:
  - name: the-manager-postgres
    databaseName: housing_prod
    user: postgres
    plan: starter
