# Serves the built PWA and reverse-proxies /api and /uploads to the
# backend on the SAME origin — required by src/api/client.ts's relative
# baseURL ("/api/v1") and vite.config.ts's dev-server proxy, which both
# assume this topology already (see their comments). "backend" below is
# the Docker Compose service name (docker-compose.prod.yml) — change it
# to whatever hostname resolves to the backend container in your setup
# (a Kubernetes Service name, an internal load balancer DNS name, etc.)
# if you're not using that compose file.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Service worker and manifest must always be revalidated — a stale
    # cached sw.js can pin users to an old app version indefinitely
    # (vite-plugin-pwa's registerType: "autoUpdate" depends on the browser
    # actually fetching a fresh sw.js to detect updates at all).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed filenames (Vite's default) are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Covers both the /api/v1/uploads/* POST endpoints and the
    # authenticated payment-proof download at
    # /api/v1/payments/{id}/proofs/{proof_id}/file — there's no separate
    # top-level /uploads path to proxy; app/main.py's comment notes the
    # old public StaticFiles mount was removed as an audit fix, so every
    # upload-related route lives under /api/v1 now.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — client-side routing (React Router) owns everything
    # else; this must NOT catch /api or /uploads (handled above first).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
