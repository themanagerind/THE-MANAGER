# Serves the built PWA and reverse-proxies /api and /uploads to the
# backend on the SAME origin — required by src/api/client.ts's relative
# baseURL ("/api/v1") and vite.config.ts's dev-server proxy, which both
# assume this topology already (see their comments). "backend" is the
# Docker Compose service name (docker-compose.prod.yml), but that bare
# hostname only resolves inside a Compose network. On Railway the backend
# is reachable via private networking at "backend.railway.internal", which
# is what the upstream variable below uses. Change it to whatever hostname
# resolves to the backend in your setup (a Kubernetes Service name, an
# internal load balancer DNS name, etc.) if you're not on Railway.
#
# The backend hostname is resolved at request time (resolver + a variable
# in proxy_pass), not when nginx loads the config. That lets the container
# start and serve the SPA even while the backend is not reachable yet;
# /api returns 502 only when the backend is actually unreachable.
#
# This file is an nginx image template: the Dockerfile copies it to
# /etc/nginx/templates/default.conf.template, and the image entrypoint
# (/docker-entrypoint.d/20-envsubst-on-templates.sh) renders it into
# /etc/nginx/conf.d/default.conf at container start, substituting only
# defined environment variables (e.g. NGINX_LOCAL_RESOLVERS). nginx's own
# variables ($host, $uri, $scheme, ...) are left untouched.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # NGINX_LOCAL_RESOLVERS is set by the official nginx image's own
    # /docker-entrypoint.d/15-local-resolvers.envsh (reads the container's
    # /etc/resolv.conf, bracketing IPv6 addresses) — but that script
    # itself only runs if NGINX_ENTRYPOINT_LOCAL_RESOLVERS is set to any
    # non-empty value first (see the ENV line in Dockerfile; that's a
    # DIFFERENT variable from the one used below — the first just opts
    # into running the detection, the second is what it produces).
    # Required for the variable-based proxy_pass in /api/ below — without
    # a resolver directive, nginx has no way to resolve $backend_upstream
    # at request time at all.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

    # Baseline hardening (CLAUDE.md Section 2 — OWASP compliance). No HSTS
    # here deliberately: TLS terminates upstream of this container (a load
    # balancer or another reverse proxy), which is the right place to set
    # Strict-Transport-Security — setting it here too would send it even
    # over a plain-HTTP health check against this container directly.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Service worker and manifest must always be revalidated — a stale
    # cached sw.js can pin users to an old app version indefinitely
    # (vite-plugin-pwa's registerType: "autoUpdate" depends on the browser
    # actually fetching a fresh sw.js to detect updates at all).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed filenames (Vite's default) are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Covers both the /api/v1/uploads/* POST endpoints and the
    # authenticated payment-proof download at
    # /api/v1/payments/{id}/proofs/{proof_id}/file — there's no separate
    # top-level /uploads path to proxy; app/main.py's comment notes the
    # old public StaticFiles mount was removed as an audit fix, so every
    # upload-related route lives under /api/v1 now.
    location /api/ {
        # No URI part in proxy_pass, so the original request URI is
        # forwarded unchanged (/api/v1/x -> /api/v1/x), as before.
        set $backend_upstream http://backend.railway.internal:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — client-side routing (React Router) owns everything
    # else; this must NOT catch /api or /uploads (handled above first).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
